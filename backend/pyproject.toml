[project]
name = "travel-agent"
version = "0.1.0"
description = "AI-powered travel planning agent: Claude tool-use loop over Duffel (flights) and Geoapify (POI), served via FastAPI with SSE streaming"
readme = "README.md"
authors = [
    { name = "zachprunierpriv", email = "zach.prunier+github@live.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.105.2",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.48.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
serve = "travel_agent.api.main:serve"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/travel_agent --cov-report=term-missing"

[tool.coverage.run]
source = ["src/travel_agent"]
omit = ["*/tests/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
]
